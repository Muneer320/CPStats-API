name: Verify
on:
  push:
  pull_request:
  schedule:
    - cron: '25 6 * * 1'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q
      - run: python -m compileall -q main.py rating_fetcher.py
      - name: Live contract check
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python -m tests.live_contract
